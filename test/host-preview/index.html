<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acpira host preview</title>
<!-- The real webview bundle, served by `acpira --ws` (`pnpm harness`) from dist/webview (run `pnpm build` first) -->
<link rel="stylesheet" href="/webview/main.css">
<link rel="stylesheet" href="/host-preview/host.css">
</head>
<!-- VS Code hangs its scheme on body; the shim swaps the class when ?theme=light is given -->
<body class="vscode-dark">
<div id="root"></div>
<div id="harness-toasts"></div>
<!-- The shell: connects to the sidecar over WebSocket, injects window.__acpiraApi before the bundle runs, answers platform requests -->
<script src="/host-preview/shim.js"></script>
<script type="module" src="/webview/main.js"></script>
</body>
</html>
