# IntelliJ IDEA plugin shell for Acpira. Built against IntelliJ Platform 2026.1 (261, Java 21) so the
# same artifact also runs on 2026.2 (262, built with Java 25): always build with the oldest supported SDK.
platformVersion = 2026.1.4
pluginSinceBuild = 261

# Kotlin stdlib comes with the IDE -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g
