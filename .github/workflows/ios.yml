name: iOS

# The iOS app's done check (apps/ios/scripts/check.sh, docs/dev/ios.md) on a macOS runner: AcpiraKit's tests on the Mac
# and on a simulator, then the app scheme. Without the networking XCFramework (ACPIRA_NET=0), as a fresh checkout
# builds it; signing and TestFlight uploads stay off CI.

on:
  push:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub's Xcode 27 runner image (macos-26 stops at Xcode 26.6)
    runs-on: xcode-27
    # A clean run takes about ten minutes; a hung test should not hold the runner for an hour
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The newest installed Xcode 27: the app builds against the iOS 27 SDK and the scripts' iPhone 18 Pro device
      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)"
          test -n "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
      - name: check.sh
        env:
          ACPIRA_NET: '0'
          # No idle reaper left behind: the runner goes away with its device
          ACPIRA_SIM_IDLE: '0'
          ACPIRA_RESULTS: ${{ runner.temp }}/ios-results
        run: apps/ios/scripts/check.sh
      # The failed expectations behind -quiet's bare test names
      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-results
          path: ${{ runner.temp }}/ios-results
          if-no-files-found: ignore
          retention-days: 7
