name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; publishing requires an existing Release tag such as v1.0.0
        required: true
        default: main
        type: string
      publish:
        description: Publish to both marketplaces and attach the VSIX to the existing Release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  # The Rust sidecar both shells ship, for six platforms, each built on a runner of its OS (Linux builds are static musl binaries).
  # One job per platform: the release profile (thin LTO, one codegen unit) leaves most cores idle, so two targets in one job
  # roughly double the critical path, while separate jobs build in parallel.
  sidecar:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      matrix:
        include:
          - runner: macos-latest
            platform: mac-arm64
          - runner: macos-latest
            platform: mac-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-x86_64
          - runner: windows-latest
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.platform }}
      - name: Install musl-gcc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The engine suites drive test/fake-agent.ts, which needs the repository's node_modules
      - uses: pnpm/action-setup@v6
        if: matrix.platform == 'linux-x86_64'
      - name: Install node_modules for the engine suites
        if: matrix.platform == 'linux-x86_64'
        run: pnpm install --frozen-lockfile
      - name: Rust tests
        if: matrix.platform == 'linux-x86_64'
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build the sidecar
        run: node scripts/release/build-sidecar.mjs ${{ matrix.platform }}
      # Cross-built targets (mac-x86_64 on Apple silicon, windows-arm64 on x64) cannot run on their runner and are skipped here
      - name: Check the binary this runner can execute
        shell: bash
        run: |
          host=$(node --input-type=module -e "import('./scripts/release/sidecar-targets.mjs').then(m => console.log(m.hostPlatform()))")
          if [ "$host" != "${{ matrix.platform }}" ]; then echo "$host runner cannot execute ${{ matrix.platform }}; skipped"; exit 0; fi
          exe="dist/sidecar/$host/acpira"; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" --version)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.platform }}
          path: dist/sidecar/
          if-no-files-found: error
          retention-days: 30

  # Native Windows regressions, in parallel with the sidecar builds instead of ahead of the Windows ones.
  windows-compat:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: windows-compat
      - name: Windows compatibility regressions (PowerShell 5.1)
        shell: powershell
        run: ./scripts/ci/test-windows.ps1

  build:
    # Only stable releases are supported; manual runs default to validation only.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    needs: [sidecar, windows-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Validate release version
        id: manifest
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { name, publisher, version } = JSON.parse(readFileSync('apps/vscode/package.json', 'utf8'));
          if (name !== 'acpira' || publisher !== 'hotic') throw new Error('Unexpected extension identity');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('A stable version is required');
          if (process.env.PUBLISH === 'true') {
            if (process.env.RELEASE_REF !== `v${version}`) throw new Error('Release tag must match apps/vscode/package.json');
            const release = JSON.parse(execFileSync('gh', [
              'release', 'view', process.env.RELEASE_REF, '--repo', process.env.GITHUB_REPOSITORY,
              '--json', 'isDraft,isPrerelease',
            ], { encoding: 'utf8' }));
            if (release.isDraft || release.isPrerelease) throw new Error('Publish a stable GitHub Release first');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: dist/sidecar
      - run: chmod +x dist/sidecar/*/acpira
      - run: pnpm typecheck
      # The suites drive the sidecar; here that is the shipped Linux binary (no Rust toolchain on this runner)
      - run: ACPIRA_SIDECAR_BIN="$PWD/dist/sidecar/linux-x86_64/acpira" pnpm test
      - name: Build the VSIXes once for both marketplaces
        run: |
          pnpm build
          node scripts/release/package-vsix.mjs --all
      - name: Record package checksums
        run: |
          sha256sum *.vsix > vsix.sha256
          cat vsix.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: |
            *.vsix
            vsix.sha256
          if-no-files-found: error
          retention-days: 30

  # The IntelliJ plugin: the same version (build.gradle.kts reads package.json), one zip per OS / CPU with its sidecar binary.
  build-idea:
    needs: [sidecar, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'release' }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: dist/sidecar
      - name: Build the webview and sidecar bundles
        run: pnpm build
      - name: Build, verify and package the plugin
        working-directory: apps/intellij
        # Release classes and tests must come from the checked-out tag, including inlined Kotlin constants.
        run: ./gradlew test buildPlugin verifyPlugin buildPluginVariants buildMarketplacePlugin checksums --rerun-tasks --no-build-cache --no-daemon
      - name: Check the plugin version against the release
        env:
          version: ${{ needs.build.outputs.version }}
        run: |
          ls apps/intellij/build/distributions
          for target in mac-arm64 mac-x86_64 linux-arm64 linux-x86_64 windows-arm64 windows-x86_64; do
            test -f "apps/intellij/build/distributions/acpira-$version-$target.zip"
          done
          python3 scripts/release/verify-idea-packages.py
          cat apps/intellij/build/distributions/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: |
            apps/intellij/build/distributions/acpira-*-*.zip
            apps/intellij/build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # The macOS desktop app (docs/releasing.md "Desktop app"): Developer ID signed, notarized and stapled, then packed for its
  # own updater (full package, deltas from the last three releases' full packages, this platform's part of the manifest,
  # which desktop-update merges and signs). Without the signing secrets every step after the check is skipped, so the VSIX
  # and plugin releases never wait on it.
  desktop:
    needs: [sidecar, build]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      version: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check signing credentials
        id: creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ] || [ -z "$DESKTOP_UPDATE_KEY" ]; then
            echo '::notice::No Developer ID / notarization / update key secrets: the desktop app is not built.'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        if: steps.creds.outputs.ready == 'true'
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          workspaces: |
            rust
            apps/desktop
          key: desktop
      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.creds.outputs.ready == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/acpira.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sidecar-mac-arm64
          path: dist/sidecar
      - name: Build, sign and notarize the app
        if: steps.creds.outputs.ready == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          chmod +x dist/sidecar/*/acpira dist/sidecar/*/acpira-gateway
          pnpm build
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          (cd apps/desktop && node scripts/package.mjs)
          rm "$APPLE_API_KEY_PATH"
          app=apps/desktop/target/aarch64-apple-darwin/release/bundle/macos/Acpira.app
          codesign --verify --deep --strict "$app"
          spctl -a -t exec "$app"
          xcrun stapler validate "$app"
      - name: Pack the update
        if: steps.creds.outputs.ready == 'true'
        run: |
          (cd rust && cargo build --release --locked -p acpira-desktop --bin acpira-update-pack)
          mkdir -p prev out part
          # Deltas from the full packages of the last three stable releases that shipped one
          prev=()
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName' | grep -vFx "v$version" | head -3); do
            from="${tag#v}"
            if gh release download "$tag" --dir prev --pattern "Acpira-$from-darwin-aarch64.app.tar.zst" 2>/dev/null; then
              prev+=(--prev "$from=prev/Acpira-$from-darwin-aarch64.app.tar.zst")
            fi
          done
          gh release view "$RELEASE_TAG" --json body --jq .body > notes.md 2>/dev/null || : > notes.md
          rust/target/release/acpira-update-pack pack --app apps/desktop/target/aarch64-apple-darwin/release/bundle/macos/Acpira.app \
            --version "$version" --base-url "https://github.com/$GH_REPO/releases/download/v$version" --out out \
            --notes-file notes.md "${prev[@]}" --unsigned
          # This platform's part of the manifest; desktop-update merges the parts and signs the result
          mv out/desktop-update.json part/
          cp apps/desktop/target/aarch64-apple-darwin/release/bundle/dmg/Acpira_"$version"_aarch64.dmg out/
          (cd out && shasum -a 256 Acpira* > desktop.sha256)
          cat out/desktop.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          name: desktop-app
          path: out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          name: desktop-update-darwin-aarch64
          path: part/
          if-no-files-found: error
          retention-days: 30
      # The packages only: the manifest goes up in desktop-update, after every platform's files are on the Release
      - name: Attach the app to the GitHub Release
        if: steps.creds.outputs.ready == 'true' && env.PUBLISH == 'true'
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in out/*; do
            grep -Fxq "$(basename "$file")" assets.txt || gh release upload "$RELEASE_TAG" "$file"
          done

  # The Windows desktop app (docs/dev/desktop.md "Windows"): one portable Acpira.exe carrying the engine and the page
  # (apps/desktop/scripts/package-windows.mjs), not Authenticode-signed yet, as a zip, plus its update packages (the exe
  # as a one-file full package, deltas from the last three releases' exe packages) and this platform's manifest part.
  # It needs no secret; the VSIX and plugin releases do not wait on it.
  desktop-windows:
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      version: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/desktop
          key: desktop-windows
      - run: pnpm install --frozen-lockfile
      - name: Build the exe
        run: |
          pnpm build
          node apps/desktop/scripts/package-windows.mjs
          # The engine role answers --version: the page and the engine made it into the one exe
          test "$(apps/desktop/target/windows/Acpira.exe --version)" = "$version"
      - name: Pack the update
        run: |
          (cd rust && cargo build --release --locked -p acpira-desktop --bin acpira-update-pack)
          mkdir -p prev out part
          # Deltas from the exe packages of the last three stable releases that shipped one
          prev=()
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName' | grep -vFx "v$version" | head -3); do
            from="${tag#v}"
            if gh release download "$tag" --dir prev --pattern "Acpira-$from-windows-x86_64.exe.tar.zst" 2>/dev/null; then
              prev+=(--prev "$from=prev/Acpira-$from-windows-x86_64.exe.tar.zst")
            fi
          done
          gh release view "$RELEASE_TAG" --json body --jq .body > notes.md 2>/dev/null || : > notes.md
          rust/target/release/acpira-update-pack.exe pack --app apps/desktop/target/windows/Acpira.exe --platform windows-x86_64 \
            --version "$version" --base-url "https://github.com/$GH_REPO/releases/download/v$version" --out out \
            --notes-file notes.md "${prev[@]}" --unsigned
          mv out/desktop-update.json part/
          cp "apps/desktop/target/windows/Acpira-$version-windows-x86_64.zip" out/
          (cd out && sha256sum Acpira* > desktop-windows.sha256)
          cat out/desktop-windows.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: out/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-update-windows-x86_64
          path: part/
          if-no-files-found: error
          retention-days: 30
      - name: Attach the app to the GitHub Release
        if: env.PUBLISH == 'true'
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in out/*; do
            grep -Fxq "$(basename "$file")" assets.txt || gh release upload "$RELEASE_TAG" "$file"
          done

  # One update manifest for every desktop platform that built (macOS is left out without its signing secrets), signed
  # once with DESKTOP_UPDATE_KEY. It goes up last: until then the latest release offers no update that points at
  # missing files. Without the key nothing is merged and installed apps keep the previous release's manifest
  desktop-update:
    needs: [build, desktop, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the update key
        id: key
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          if [ -z "$DESKTOP_UPDATE_KEY" ]; then
            echo '::notice::No DESKTOP_UPDATE_KEY secret: no update manifest is published.'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        if: steps.key.outputs.ready == 'true'
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: rust
          key: desktop-update
      - uses: actions/download-artifact@v8
        if: steps.key.outputs.ready == 'true'
        with:
          pattern: desktop-update-*
          path: parts
      - name: Merge and sign the manifest
        if: steps.key.outputs.ready == 'true'
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          (cd rust && cargo build --release --locked -p acpira-desktop --bin acpira-update-pack)
          rust/target/release/acpira-update-pack merge --out out parts/*/desktop-update.json
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.ready == 'true'
        with:
          name: desktop-update
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Attach the manifest to the GitHub Release
        if: steps.key.outputs.ready == 'true' && env.PUBLISH == 'true'
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for name in desktop-update.json desktop-update.json.sig; do
            grep -Fxq "$name" assets.txt || gh release upload "$RELEASE_TAG" "out/$name"
          done

  release-asset:
    needs: [build]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      # The VSIXes only: the IntelliJ plugin is installed from the JetBrains Marketplace, so its zips stay CI artifacts
      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
        run: |
          sha256sum --check vsix.sha256
          # Keep original release assets on retries instead of replacing a published package.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in *.vsix vsix.sha256; do
            if ! grep -Fxq "$(basename "$file")" assets.txt; then
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done

  jetbrains-marketplace:
    needs: [build, build-idea]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check publishing credential
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add the JETBRAINS_MARKETPLACE_TOKEN repository secret (a Marketplace permanent token of the plugin owner).'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: intellij-plugin
      - name: Publish the universal distribution
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          version: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS --ignore-missing
          # One version works across different client/backend platforms. Per-platform archives stay CI artifacts.
          curl -fsS "https://plugins.jetbrains.com/plugins/list?pluginId=com.github.hotic.acpira" > published.xml
          if grep -Fq "<version>$version</version>" published.xml; then
            echo "$version is already on the Marketplace"
          else
            curl -fsS --header "Authorization: Bearer $PUBLISH_TOKEN" -F xmlId=com.github.hotic.acpira \
              -F "file=@acpira-$version-universal.zip" https://plugins.jetbrains.com/api/updates/upload
            echo "uploaded $version"
          fi

  vscode-marketplace:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Add the VSCE_PAT repository secret with Marketplace Manage permission.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          sha256sum --check vsix.sha256
          # One package per platform, each with its sidecar binary; there is no universal package
          for f in *.vsix; do
            npx --yes @vscode/vsce@3.9.2 publish --packagePath "$f" --skip-duplicate
          done

  open-vsx:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing credential
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Add the OVSX_PAT repository secret from the Open VSX account.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          sha256sum --check vsix.sha256
          for f in *.vsix; do
            npx --yes ovsx@1.1.1 publish "$f" --skip-duplicate
          done
