name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; publishing requires an existing Release tag such as v1.0.0
        required: true
        default: main
        type: string
      publish:
        description: Publish to both marketplaces and attach the VSIX to the existing Release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  # The Rust sidecar both shells ship, for six platforms, each built on a runner of its OS (Linux builds are static musl binaries).
  # One job per platform: the release profile (thin LTO, one codegen unit) leaves most cores idle, so two targets in one job
  # roughly double the critical path, while separate jobs build in parallel.
  sidecar:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      matrix:
        include:
          - runner: macos-latest
            platform: mac-arm64
          - runner: macos-latest
            platform: mac-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-x86_64
          - runner: windows-latest
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_CERTUM: ${{ secrets.CERTUM_OTP != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.platform }}
      - name: Install musl-gcc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The engine suites drive test/fake-agent.ts, which needs the repository's node_modules. They run in the dry run
      # (workflow_dispatch) only: the release checks the candidate beforehand on macOS and Linux (verify-candidate.sh)
      # and windows-compat runs on every push, so a published Release builds straight away instead of waiting on the
      # slowest, flakiest suite of the critical path
      - uses: pnpm/action-setup@v6
        if: matrix.platform == 'linux-x86_64' && github.event_name == 'workflow_dispatch'
      - name: Install node_modules for the engine suites
        if: matrix.platform == 'linux-x86_64' && github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile
      # Each engine handover case lands its own copy of the debug engine (hundreds of MB) under a temp home, which
      # ran the runner's disk full; the preinstalled Android SDK, .NET and GHC are not needed here
      - name: Free disk space for the engine suites
        if: matrix.platform == 'linux-x86_64' && github.event_name == 'workflow_dispatch'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Rust tests
        if: matrix.platform == 'linux-x86_64' && github.event_name == 'workflow_dispatch'
        working-directory: rust
        run: cargo test --workspace --locked
      # A Developer ID signature on the macOS engine keeps macOS privacy grants (App Management for the agents the
      # engine remote access's login service starts runs) across upgrades; build-sidecar.mjs signs with it when the
      # keychain has one, and the binaries stay ad hoc without the secret
      - name: Import the Developer ID certificate into a temporary keychain
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/import-signing-cert.sh
      # Smart App Control blocks unsigned executables outright, so build-sidecar.mjs Authenticode-signs the Windows
      # engines with the Certum cloud certificate (scripts/release/sign-windows.mjs) when the secrets are set
      - name: Install ssign
        if: runner.os == 'Windows' && env.HAS_CERTUM == 'true'
        run: cargo install ssign --version 0.1.9 --locked
      - name: Build the sidecar
        env:
          CERTUM_EMAIL: ${{ runner.os == 'Windows' && secrets.CERTUM_EMAIL || '' }}
          CERTUM_OTP: ${{ runner.os == 'Windows' && secrets.CERTUM_OTP || '' }}
        run: node scripts/release/build-sidecar.mjs ${{ matrix.platform }}
      - name: Check the Authenticode signature
        if: runner.os == 'Windows' && env.HAS_CERTUM == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/sidecar/${{ matrix.platform }}/acpira.exe"
          if ($sig.Status -ne 'Valid') { throw "signature $($sig.Status): $($sig.StatusMessage)" }
          $sig.SignerCertificate.Subject
      # Cross-built targets (mac-x86_64 on Apple silicon, windows-arm64 on x64) cannot run on their runner and are skipped here
      - name: Check the binary this runner can execute
        shell: bash
        run: |
          host=$(node --input-type=module -e "import('./scripts/release/sidecar-targets.mjs').then(m => console.log(m.hostPlatform()))")
          if [ "$host" != "${{ matrix.platform }}" ]; then echo "$host runner cannot execute ${{ matrix.platform }}; skipped"; exit 0; fi
          exe="dist/sidecar/$host/acpira"; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" --version)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.platform }}
          path: dist/sidecar/
          if-no-files-found: error
          retention-days: 30

  # Native Windows regressions, in parallel with the sidecar builds instead of ahead of the Windows ones.
  windows-compat:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: windows-compat
      - name: Windows compatibility regressions (PowerShell 5.1)
        shell: powershell
        run: ./scripts/ci/test-windows.ps1

  build:
    # Only stable releases are supported; manual runs default to validation only.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    needs: [sidecar, windows-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Validate release version
        id: manifest
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { name, publisher, version } = JSON.parse(readFileSync('apps/vscode/package.json', 'utf8'));
          if (name !== 'acpira' || publisher !== 'hotic') throw new Error('Unexpected extension identity');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('A stable version is required');
          if (process.env.PUBLISH === 'true') {
            if (process.env.RELEASE_REF !== `v${version}`) throw new Error('Release tag must match apps/vscode/package.json');
            const release = JSON.parse(execFileSync('gh', [
              'release', 'view', process.env.RELEASE_REF, '--repo', process.env.GITHUB_REPOSITORY,
              '--json', 'isDraft,isPrerelease',
            ], { encoding: 'utf8' }));
            if (release.isDraft || release.isPrerelease) throw new Error('Publish a stable GitHub Release first');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: dist/sidecar
      - run: chmod +x dist/sidecar/*/acpira
      - run: pnpm typecheck
      # The suites drive the sidecar; here that is the shipped Linux binary (no Rust toolchain on this runner)
      - run: ACPIRA_SIDECAR_BIN="$PWD/dist/sidecar/linux-x86_64/acpira" pnpm test
      - name: Build the VSIXes once for both marketplaces
        run: |
          pnpm build
          node scripts/release/package-vsix.mjs --all
      - name: Record package checksums
        run: |
          sha256sum *.vsix > vsix.sha256
          cat vsix.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: |
            *.vsix
            vsix.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: sums-vsix
          path: vsix.sha256
          if-no-files-found: error
          retention-days: 30

  # The IntelliJ plugin: the same version (build.gradle.kts reads package.json), one zip per OS / CPU with its sidecar binary.
  build-idea:
    needs: [sidecar, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'release' }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: dist/sidecar
      - name: Build the webview and sidecar bundles
        run: pnpm build
      - name: Build, verify and package the plugin
        working-directory: apps/intellij
        # Release classes and tests must come from the checked-out tag, including inlined Kotlin constants.
        run: ./gradlew test buildPlugin verifyPlugin buildPluginVariants buildMarketplacePlugin checksums --rerun-tasks --no-build-cache --no-daemon
      - name: Check the plugin version against the release
        env:
          version: ${{ needs.build.outputs.version }}
        run: |
          ls apps/intellij/build/distributions
          for target in mac-arm64 mac-x86_64 linux-arm64 linux-x86_64 windows-arm64 windows-x86_64; do
            test -f "apps/intellij/build/distributions/acpira-$version-$target.zip"
          done
          python3 scripts/release/verify-idea-packages.py
          cat apps/intellij/build/distributions/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: |
            apps/intellij/build/distributions/acpira-*-*.zip
            apps/intellij/build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # The macOS desktop app (docs/releasing.md "Desktop app"): Developer ID signed, notarized and stapled, then packed for its
  # own updater (full package, deltas from the last three releases' full packages, this platform's part of the manifest,
  # which desktop-update merges and signs). Without the signing secrets every step after the check is skipped, so the VSIX
  # and plugin releases never wait on it.
  desktop:
    needs: [sidecar, build]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      version: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check signing credentials
        id: creds
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY_P8" ] || [ -z "$DESKTOP_UPDATE_KEY" ]; then
            echo '::notice::No Developer ID / notarization / update key secrets: the desktop app is not built.'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        if: steps.creds.outputs.ready == 'true'
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          workspaces: |
            rust
            apps/desktop
          key: desktop
      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.creds.outputs.ready == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/ci/import-signing-cert.sh
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/download-artifact@v8
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sidecar-mac-arm64
          path: dist/sidecar
      - name: Build, sign and notarize the app
        if: steps.creds.outputs.ready == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          chmod +x dist/sidecar/*/acpira
          pnpm build
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          (cd apps/desktop && node scripts/package.mjs)
          rm "$APPLE_API_KEY_PATH"
          app=apps/desktop/target/aarch64-apple-darwin/release/bundle/macos/Acpira.app
          codesign --verify --deep --strict "$app"
          spctl -a -t exec "$app"
          xcrun stapler validate "$app"
      - name: Pack the update
        if: steps.creds.outputs.ready == 'true'
        run: |
          (cd rust && cargo build --release --locked -p acpira-desktop --bin acpira-update-pack)
          mkdir -p prev out part
          # Deltas from the full packages of the last three stable releases that shipped one
          prev=()
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName' | grep -vFx "v$version" | head -3); do
            from="${tag#v}"
            # On the packages Release since 2.0.6, on the version's own Release before
            if gh release download packages --dir prev --pattern "Acpira-$from-darwin-aarch64.app.tar.zst" 2>/dev/null \
              || gh release download "$tag" --dir prev --pattern "Acpira-$from-darwin-aarch64.app.tar.zst" 2>/dev/null; then
              prev+=(--prev "$from=prev/Acpira-$from-darwin-aarch64.app.tar.zst")
            fi
          done
          gh release view "$RELEASE_TAG" --json body --jq .body > notes.md 2>/dev/null || : > notes.md
          rust/target/release/acpira-update-pack pack --app apps/desktop/target/aarch64-apple-darwin/release/bundle/macos/Acpira.app \
            --version "$version" --base-url "https://github.com/$GH_REPO/releases/download/packages" --out out \
            --notes-file notes.md "${prev[@]}" --unsigned
          # This platform's part of the manifest; desktop-update merges the parts and signs the result
          mv out/desktop-update.json part/
          # out/ (update packages) goes to the packages Release, dl/ (the dmg) to the version's Release
          mkdir -p dl sums
          cp apps/desktop/target/aarch64-apple-darwin/release/bundle/dmg/Acpira_"$version"_aarch64.dmg dl/
          (cd dl && shasum -a 256 *; cd ../out && shasum -a 256 *) > sums/desktop-mac.sha256
          cat sums/desktop-mac.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          name: desktop-app
          path: |
            out/
            dl/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          name: sums-desktop-mac
          path: sums/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          name: desktop-update-darwin-aarch64
          path: part/
          if-no-files-found: error
          retention-days: 30
      # The packages only: the manifest goes up in desktop-update, after every platform's files are on the Releases
      - name: Attach the app to the GitHub Releases
        if: steps.creds.outputs.ready == 'true' && env.PUBLISH == 'true'
        run: |
          node scripts/release/packages-release.mjs upload out/*
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in dl/*; do
            grep -Fxq "$(basename "$file")" assets.txt || gh release upload "$RELEASE_TAG" "$file"
          done

  # The Windows desktop app (docs/dev/desktop.md "Windows"): one portable Acpira.exe carrying the engine and the page
  # (apps/desktop/scripts/package-windows.mjs), Authenticode-signed with the Certum cloud certificate when CERTUM_OTP is
  # set, as a zip, plus its update packages (the exe as a one-file full package, deltas from the last three releases'
  # exe packages) and this platform's manifest part. The VSIX and plugin releases do not wait on it.
  desktop-windows:
    needs: [build]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      version: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HAS_CERTUM: ${{ secrets.CERTUM_OTP != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/desktop
          key: desktop-windows
      - run: pnpm install --frozen-lockfile
      - name: Install ssign
        if: env.HAS_CERTUM == 'true'
        run: cargo install ssign --version 0.1.9 --locked
      - name: Build the exe
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          pnpm build
          node apps/desktop/scripts/package-windows.mjs
          # The engine role answers --version: the page and the engine made it into the one exe
          test "$(apps/desktop/target/windows/Acpira.exe --version)" = "$version"
      - name: Check the Authenticode signature
        if: env.HAS_CERTUM == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature apps/desktop/target/windows/Acpira.exe
          if ($sig.Status -ne 'Valid') { throw "signature $($sig.Status): $($sig.StatusMessage)" }
          $sig.SignerCertificate.Subject
      - name: Pack the update
        run: |
          (cd rust && cargo build --release --locked -p acpira-desktop --bin acpira-update-pack)
          mkdir -p prev out part
          # Deltas from the exe packages of the last three stable releases that shipped one
          prev=()
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 10 --json tagName --jq '.[].tagName' | grep -vFx "v$version" | head -3); do
            from="${tag#v}"
            # On the packages Release since 2.0.6, on the version's own Release before
            if gh release download packages --dir prev --pattern "Acpira-$from-windows-x86_64.exe.tar.zst" 2>/dev/null \
              || gh release download "$tag" --dir prev --pattern "Acpira-$from-windows-x86_64.exe.tar.zst" 2>/dev/null; then
              prev+=(--prev "$from=prev/Acpira-$from-windows-x86_64.exe.tar.zst")
            fi
          done
          gh release view "$RELEASE_TAG" --json body --jq .body > notes.md 2>/dev/null || : > notes.md
          rust/target/release/acpira-update-pack.exe pack --app apps/desktop/target/windows/Acpira.exe --platform windows-x86_64 \
            --version "$version" --base-url "https://github.com/$GH_REPO/releases/download/packages" --out out \
            --notes-file notes.md "${prev[@]}" --unsigned
          mv out/desktop-update.json part/
          # out/ (update packages) goes to the packages Release, dl/ (the zip) to the version's Release
          mkdir -p dl sums
          cp "apps/desktop/target/windows/Acpira-$version-windows-x86_64.zip" dl/
          (cd dl && sha256sum *; cd ../out && sha256sum *) > sums/desktop-windows.sha256
          cat sums/desktop-windows.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            out/
            dl/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: sums-desktop-windows
          path: sums/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-update-windows-x86_64
          path: part/
          if-no-files-found: error
          retention-days: 30
      - name: Attach the app to the GitHub Releases
        if: env.PUBLISH == 'true'
        run: |
          node scripts/release/packages-release.mjs upload out/*
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in dl/*; do
            grep -Fxq "$(basename "$file")" assets.txt || gh release upload "$RELEASE_TAG" "$file"
          done

  # The Linux desktop app (docs/dev/desktop.md "Linux"), a preview: deb, rpm and AppImage for x64 from
  # apps/desktop/scripts/package-linux.mjs, built on Ubuntu 22.04 for a low glibc floor. No in-app updates yet, so it
  # adds nothing to the manifest; it needs no secret and nothing waits on it but release-sums.
  desktop-linux:
    needs: [sidecar, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      version: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/desktop
          key: desktop-linux
      # GTK 3 / WebKitGTK 4.1 to link the shell; rpm, squashfs, patchelf and file for the rpm and the AppImage
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev rpm zstd squashfs-tools desktop-file-utils patchelf \
            fakeroot file
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: sidecar-linux-x86_64
          path: dist/sidecar
      - name: Build the packages
        run: |
          chmod +x dist/sidecar/*/acpira
          pnpm build
          node apps/desktop/scripts/package-linux.mjs
          mkdir -p dl sums
          bundle=apps/desktop/target/x86_64-unknown-linux-gnu/release/bundle
          cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage dl/
          # One of each, named for this version
          set -- dl/*"$version"*
          test $# = 3
          (cd dl && sha256sum *) > sums/desktop-linux.sha256
          cat sums/desktop-linux.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: dl/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: sums-desktop-linux
          path: sums/
          if-no-files-found: error
          retention-days: 30
      - name: Attach the packages to the GitHub Release
        if: env.PUBLISH == 'true'
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in dl/*; do
            grep -Fxq "$(basename "$file")" assets.txt || gh release upload "$RELEASE_TAG" "$file"
          done

  # One update manifest for every desktop platform that built (macOS is left out without its signing secrets), signed
  # once with DESKTOP_UPDATE_KEY. It goes up last: until then the latest release offers no update that points at
  # missing files. Without the key nothing is merged and installed apps keep the previous release's manifest
  desktop-update:
    needs: [build, desktop, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the update key
        id: key
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          if [ -z "$DESKTOP_UPDATE_KEY" ]; then
            echo '::notice::No DESKTOP_UPDATE_KEY secret: no update manifest is published.'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        if: steps.key.outputs.ready == 'true'
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: rust
          key: desktop-update
      - uses: actions/download-artifact@v8
        if: steps.key.outputs.ready == 'true'
        with:
          pattern: desktop-update-*
          path: parts
      - name: Merge and sign the manifest
        if: steps.key.outputs.ready == 'true'
        env:
          DESKTOP_UPDATE_KEY: ${{ secrets.DESKTOP_UPDATE_KEY }}
        run: |
          (cd rust && cargo build --release --locked -p acpira-desktop --bin acpira-update-pack)
          rust/target/release/acpira-update-pack merge --out out parts/*/desktop-update.json
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.ready == 'true'
        with:
          name: desktop-update
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Attach the manifest to the GitHub Release
        if: steps.key.outputs.ready == 'true' && env.PUBLISH == 'true'
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for name in desktop-update.json desktop-update.json.sig; do
            grep -Fxq "$name" assets.txt || gh release upload "$RELEASE_TAG" "out/$name"
          done

  # The VSIXes go to the packages Release, not the version's: they install from the marketplaces, and an engine connecting
  # to an SSH host without its platform's build takes that platform's VSIX from there, checked against the version's
  # SHA256SUMS (rust/crates/acpira-host/src/remote/fetch.rs). The IntelliJ zips stay off GitHub: the plugin installs from
  # the JetBrains Marketplace
  release-asset:
    needs: [build]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
          path: vsix
      - name: Attach the VSIXes to the packages Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd vsix && sha256sum --check vsix.sha256)
          node scripts/release/packages-release.mjs upload vsix/*.vsix

  # The version's one checksum file, listing its downloads and its files on the packages Release alike, from whatever
  # built (the macOS app is missing without its secrets). Then files of versions outside the newest ten stable Releases
  # leave the packages Release: deltas only reach back three, and an engine that old fetches no SSH helper anymore
  release-sums:
    needs: [build, release-asset, desktop, desktop-windows, desktop-linux]
    if: always() && needs.build.result == 'success' && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/download-artifact@v8
        with:
          pattern: sums-*
          merge-multiple: true
          path: sums
      - name: Attach SHA256SUMS
        run: |
          cat sums/*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          # Replaced on a rerun: a job that failed before may have added files since
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
      - name: Prune the packages Release
        if: needs.release-asset.result == 'success'
        run: node scripts/release/packages-release.mjs prune 10

  # Rebuilds acpira.com once the version's downloads are all attached: its build reads the newest stable Release that
  # carries every installer (acpira-web scripts/release.mjs), so a desktop job that failed leaves the site on the version
  # before. Without the VERCEL_DEPLOY_HOOK secret it only notes the skip
  website:
    needs: [release-sums]
    if: always() && needs.release-sums.result == 'success' && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the website build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo '::notice::No VERCEL_DEPLOY_HOOK secret: acpira.com keeps its version until it is rebuilt.'
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 -X POST "$HOOK" > /dev/null

  jetbrains-marketplace:
    needs: [build, build-idea]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check publishing credential
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add the JETBRAINS_MARKETPLACE_TOKEN repository secret (a Marketplace permanent token of the plugin owner).'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: intellij-plugin
      - name: Publish the universal distribution
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          version: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS --ignore-missing
          # One version works across different client/backend platforms. The per-platform zips stay workflow artifacts.
          curl -fsS "https://plugins.jetbrains.com/plugins/list?pluginId=com.github.hotic.acpira" > published.xml
          if grep -Fq "<version>$version</version>" published.xml; then
            echo "$version is already on the Marketplace"
          else
            curl -fsS --header "Authorization: Bearer $PUBLISH_TOKEN" -F xmlId=com.github.hotic.acpira \
              -F "file=@acpira-$version-universal.zip" https://plugins.jetbrains.com/api/updates/upload
            echo "uploaded $version"
          fi

  vscode-marketplace:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Add the VSCE_PAT repository secret with Marketplace Manage permission.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          sha256sum --check vsix.sha256
          # One package per platform, each with its sidecar binary; there is no universal package
          for f in *.vsix; do
            npx --yes @vscode/vsce@3.9.2 publish --packagePath "$f" --skip-duplicate
          done

  open-vsx:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing credential
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Add the OVSX_PAT repository secret from the Open VSX account.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          sha256sum --check vsix.sha256
          for f in *.vsix; do
            npx --yes ovsx@1.1.1 publish "$f" --skip-duplicate
          done
