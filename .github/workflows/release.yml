name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; publishing requires an existing Release tag such as v1.0.0
        required: true
        default: main
        type: string
      publish:
        description: Publish to both marketplaces and attach the VSIX to the existing Release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  # The Rust sidecar both shells ship, for six platforms, each built on a runner of its OS (Linux builds are static musl binaries).
  sidecar:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      matrix:
        include:
          - runner: macos-latest
            platforms: mac-arm64 mac-x86_64
          - runner: ubuntu-24.04
            platforms: linux-x86_64
          - runner: ubuntu-24.04-arm
            platforms: linux-arm64
          - runner: windows-latest
            platforms: windows-x86_64 windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.runner }}
      - name: Install musl-gcc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The engine suites drive test/fake-agent.ts, which needs the repository's node_modules
      - uses: pnpm/action-setup@v6
        if: matrix.runner == 'ubuntu-24.04'
      - name: Install node_modules for the engine suites
        if: matrix.runner == 'ubuntu-24.04'
        run: pnpm install --frozen-lockfile
      - name: Rust tests
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Build the sidecar
        run: node scripts/build-sidecar.mjs ${{ matrix.platforms }}
      - name: Check the binary this runner can execute
        shell: bash
        run: |
          host=$(node --input-type=module -e "import('./scripts/sidecar-targets.mjs').then(m => console.log(m.hostPlatform()))")
          exe="dist/sidecar/$host/acpira"; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" --version)" = "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.runner }}
          path: dist/sidecar/
          if-no-files-found: error
          retention-days: 30

  build:
    # Only stable releases are supported; manual runs default to validation only.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    needs: sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Validate release version
        id: manifest
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { name, publisher, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== 'acpira' || publisher !== 'hotic') throw new Error('Unexpected extension identity');
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('A stable version is required');
          if (process.env.PUBLISH === 'true') {
            if (process.env.RELEASE_REF !== `v${version}`) throw new Error('Release tag must match package.json');
            const release = JSON.parse(execFileSync('gh', [
              'release', 'view', process.env.RELEASE_REF, '--repo', process.env.GITHUB_REPOSITORY,
              '--json', 'isDraft,isPrerelease',
            ], { encoding: 'utf8' }));
            if (release.isDraft || release.isPrerelease) throw new Error('Publish a stable GitHub Release first');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: dist/sidecar
      - run: chmod +x dist/sidecar/*/acpira
      - run: pnpm typecheck
      # The suites drive the sidecar; here that is the shipped Linux binary (no Rust toolchain on this runner)
      - run: ACPIRA_SIDECAR_BIN="$PWD/dist/sidecar/linux-x86_64/acpira" pnpm test
      - name: Build the VSIXes once for both marketplaces
        run: |
          pnpm build
          node scripts/package-vsix.mjs --all
      - name: Record package checksums
        run: |
          sha256sum *.vsix > vsix.sha256
          cat vsix.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: extension-vsix
          path: |
            *.vsix
            vsix.sha256
          if-no-files-found: error
          retention-days: 30

  # The IntelliJ plugin: the same version (build.gradle.kts reads package.json), one zip per OS / CPU with its sidecar binary.
  build-idea:
    needs: [sidecar, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'release' }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: sidecar-*
          merge-multiple: true
          path: dist/sidecar
      - name: Build the webview and sidecar bundles
        run: pnpm build
      - name: Build, verify and package the plugin
        working-directory: idea
        run: ./gradlew test buildPlugin verifyPlugin buildPluginVariants buildMarketplacePlugin checksums --no-daemon
      - name: Check the plugin version against the release
        env:
          version: ${{ needs.build.outputs.version }}
        run: |
          ls idea/build/distributions
          for target in mac-arm64 mac-x86_64 linux-arm64 linux-x86_64 windows-arm64 windows-x86_64; do
            test -f "idea/build/distributions/acpira-$version-$target.zip"
          done
          python3 scripts/verify-idea-packages.py
          cat idea/build/distributions/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: |
            idea/build/distributions/acpira-*-*.zip
            idea/build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release-asset:
    needs: [build, build-idea]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - uses: actions/download-artifact@v8
        with:
          name: intellij-plugin
          path: idea
      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.ref }}
        run: |
          sha256sum --check vsix.sha256
          (cd idea && sha256sum --check SHA256SUMS --ignore-missing)
          # Keep original release assets on retries instead of replacing a published package.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          for file in *.vsix vsix.sha256 idea/*.zip idea/SHA256SUMS; do
            if ! grep -Fxq "$(basename "$file")" assets.txt; then
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done

  jetbrains-marketplace:
    needs: [build, build-idea]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check publishing credential
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add the JETBRAINS_MARKETPLACE_TOKEN repository secret (a Marketplace permanent token of the plugin owner).'
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: intellij-plugin
      - name: Publish the universal distribution
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          version: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS --ignore-missing
          # One version works across different client/backend platforms. Per-platform archives remain GitHub downloads only.
          curl -fsS "https://plugins.jetbrains.com/plugins/list?pluginId=com.github.hotic.acpira" > published.xml
          if grep -Fq "<version>$version</version>" published.xml; then
            echo "$version is already on the Marketplace"
          else
            curl -fsS --header "Authorization: Bearer $PUBLISH_TOKEN" -F xmlId=com.github.hotic.acpira \
              -F "file=@acpira-$version-universal.zip" https://plugins.jetbrains.com/api/updates/upload
            echo "uploaded $version"
          fi

  vscode-marketplace:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Add the VSCE_PAT repository secret with Marketplace Manage permission.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          sha256sum --check vsix.sha256
          # One package per platform, each with its sidecar binary; there is no universal package
          for f in *.vsix; do
            npx --yes @vscode/vsce@3.9.2 publish --packagePath "$f" --skip-duplicate
          done

  open-vsx:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check publishing credential
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Add the OVSX_PAT repository secret from the Open VSX account.'
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          sha256sum --check vsix.sha256
          for f in *.vsix; do
            npx --yes ovsx@1.1.1 publish "$f" --skip-duplicate
          done
