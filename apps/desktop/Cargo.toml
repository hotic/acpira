[package]
name = "acpira-desktop-tauri"
description = "The Acpira desktop app: the chat webview and the Rust engine outside any IDE, in a Tauri shell"
version = "2.0.0"
edition = "2024"
license = "MIT"
publish = false
default-run = "acpira-desktop-tauri"

# A workspace of its own: Tauri needs webkit2gtk on Linux, which the rust/ workspace's gates must not depend on
[workspace]

[features]
# The in-app hook the smoke run drives (scripts/smoke.mjs); never in a release build
smoke = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# build.rs packs the page bundle into the Windows exe; the version acpira-desktop links
zstd = { version = "0.13", default-features = false }

[dependencies]
acpira-desktop = { path = "../../rust/crates/acpira-desktop" }
acpira-shared = { path = "../../rust/crates/acpira-shared" }
# devtools: View › Developer Tools in a release build too (a private WebKit API on macOS; the app is not on the App Store)
# No default features: on macOS they only add `compression` (the frontend is a stub; the page is served from resources) and
# `dynamic-acl` (capabilities never change at run time), ~0.36 MB of the shell (2026-10-25)
tauri = { version = "2.12", default-features = false, features = ["wry", "devtools"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "raw_value"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "sync", "time", "fs"] }
uuid = { version = "1.24", features = ["v4"] }
parking_lot = "0.12"
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
# The page bundle's packed files (the Windows exe's embedded ones, src/serve.rs). No default features: they add the
# decoders of zstd's pre-1.0 formats (~110 KB) and the dictionary builder, as in rust/Cargo.toml
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults", "NSDictionary", "NSArray", "NSError"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationSettings", "block2"] }
block2 = "0.6"

# Linux: Tauri's own Linux defaults, which `default-features = false` above drops: X11 window handles (the folder dialog's
# parent) and the XDG portal's colour scheme in tao (a window's theme and its ThemeChanged events). rfd needs a backend
# there: GTK 3, which the shell links already, rather than the portal (ashpd and zbus; no message dialogs). gtk for
# src/linux.rs, at the version tao and wry link
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "devtools", "x11", "dbus"] }
rfd = { version = "0.15", default-features = false, features = ["tokio", "gtk3"] }
gtk = "0.18"

# Windows ships one exe: the engine's command line runs inside it (main.rs dispatches by the first argument), with the
# engine crates at the versions rust/Cargo.lock locks (test/desktopLock.test.ts). Win32 for src/win.rs: the version tauri
# and wry already link
[target.'cfg(windows)'.dependencies]
acpira-host = { path = "../../rust/crates/acpira-host" }
# WebView2 events Tauri does not expose (the clipboard permission), at the version wry links
webview2-com = "0.39"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Fat LTO: ~0.9 MB (6%) smaller than thin for ~15 s more on a clean build (zig cross-build, 2026-10-25). A panic aborts,
# as in the engine's profiles (rust/Cargo.toml): the Windows exe 42.5 → 26.3 MB, the macOS shell 1.8 MB smaller
[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"

# The engine's panic lints (rust/Cargo.toml [workspace.lints]), for the same reason: a release build aborts on a panic
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
string_slice = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
