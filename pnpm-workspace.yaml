# One install and one lockfile for every JavaScript package in the repository. packages/ holds the code the shells share,
# apps/ the shells that are Node packages (the desktop app, the IntelliJ plugin and the iOS app build with Cargo, Gradle and
# Xcode)
packages:
  - packages/*
  - apps/vscode

# Every external version lives here; a package.json names its dependencies with `catalog:`
catalog:
  '@agentclientprotocol/sdk': 1.4.0
  '@base-ui/react': ^1.8.0
  '@fontsource-variable/geist': 5.3.0
  '@fontsource-variable/inter': 5.3.0
  '@streamdown/cjk': ^1.0.4
  '@streamdown/math': 1.0.2
  '@streamdown/mermaid': 1.0.2
  '@tailwindcss/browser': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': 22.15.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@types/vscode': 1.106.0
  '@vitejs/plugin-react': 6.1.1
  '@vscode/vsce': ^3.9.2
  '@xterm/addon-clipboard': 0.2.0
  '@xterm/addon-fit': 0.11.0
  '@xterm/addon-search': 0.16.0
  '@xterm/addon-unicode11': 0.9.0
  '@xterm/addon-web-links': 0.12.0
  '@xterm/addon-webgl': 0.19.0
  '@xterm/xterm': 6.0.0
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  esbuild: ^0.28.2
  katex: 0.19.1
  lucide-react: 1.35.0
  react: 19.2.8
  react-dom: 19.2.8
  shiki: ^4.4.3
  streamdown: 2.6.0
  tailwind-merge: ^3.6.0
  tailwindcss: 4.3.3
  tsx: ^4.23.13
  typescript: 7.0.2
  vite: 8.2.4
  vitest: 4.1.12

onlyBuiltDependencies:
  - '@vscode/vsce-sign'
  - esbuild
  - keytar

overrides:
  '@azure/msal-node@>=5.0.0-beta.0 <7.1.0': '>=7.1.0'
  brace-expansion@>=4.0.0 <5.0.12: '>=5.0.12'
  dompurify@<=3.4.16: '>=3.4.17'
  fast-uri@>=3.0.0 <3.1.9: '>=3.1.9'
  glob@>=9.0.0 <=14.0.1: '>=14.0.2'
  katex@<0.19.1: '>=0.19.1'
  markdown-it@<14.3.3: '>=14.3.3'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  qs@>=6.7.0 <=6.16.0: '>=6.16.1'
  source-map-js@>=1.0.0 <1.2.2: '>=1.2.2'
  undici@>=7.0.0 <7.30.1: '>=7.30.1'
  zod: '>=4.6.6'
