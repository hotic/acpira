<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: media/marketplace.svg on the macOS icon grid (an 824 px tile on a 1024 canvas, about 22.5% corners,
       a soft shadow under it). Rendered to icon.png for electron-builder: rsvg-convert -w 1024 -h 1024 icon.svg -o icon.png -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2e33"/>
      <stop offset="1" stop-color="#1f2024"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- The shadow is cast by a flat copy underneath: filtering the gradient tile itself sends it through librsvg's 8-bit
       linearRGB intermediate, which bands this dark gradient into steps of 4 with a hue shift between them -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1f2024" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
  <!-- Two complementary docks share an open center (media/icon.svg), at the marketplace icon's proportion of the tile -->
  <g fill="#f5f5f5" transform="translate(250 267.5) scale(1.288)">
    <path d="M88 0H266C286 0 300 14 300 36V60C300 84 285 98 261 98H145C121 98 108 111 108 135V224C108 240 114 247 132 247H164C178 247 188 257 188 272V282H150C117 282 97 302 97 332V336H78C35 336 0 302 0 260V94C0 43 41 0 88 0Z"/>
    <path d="M316 50C370 50 407 91 407 145V299C407 344 372 380 326 380H152C127 380 113 366 113 342V332C113 311 127 298 150 298H264C285 298 298 282 298 261V168C298 151 291 145 276 145H244C229 145 222 135 222 121V114H266C297 114 316 94 316 64Z"/>
  </g>
</svg>
