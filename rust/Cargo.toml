[workspace]
resolver = "3"
members = ["crates/acpira-shared", "crates/acpira-rpc", "crates/acpira-agent", "crates/acpira-host", "crates/acpira-desktop"]

[workspace.package]
version = "1.10.8"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
acpira-shared = { path = "crates/acpira-shared" }
acpira-rpc = { path = "crates/acpira-rpc" }
acpira-agent = { path = "crates/acpira-agent" }
anyhow = "1.0.100"
base64 = "0.22"
flate2 = "1.1"
libc = "0.2"
parking_lot = "0.12"
# The built-in agent's `read` on a PDF: the text of each page (CID fonts through their ToUnicode maps)
pdf-extract = "0.12"
# The terminals the pages open (terminal.rs) and the built-in agent's interactive commands: wezterm's pseudo terminal
# layer, ConPTY on Windows
portable-pty = "0.9"
regex = "1.12"
# The desktop app's update manifest: Ed25519 signatures (already in the tree through rustls)
ring = "0.17"
same-file = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
# The desktop app's update packages: the full bundle and the delta's container
tar = { version = "0.4", default-features = false }
similar = { version = "3.2", default-features = false, features = ["std"] }
tempfile = "3.24"
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "fs", "net", "signal"] }
# socks-proxy: the engine's own requests honour a socks5:// / socks5h:// proxy setting too (net_proxy::ureq_config)
ureq = { version = "=3.4.2", features = ["socks-proxy"] }
# The desktop shell's preview addresses: WHATWG URL parsing, as the page and the TypeScript shells normalize them
url = "2.5"
uuid = { version = "1.24", features = ["v4"] }
# The desktop app's update packages: compression, and binary deltas with the installed file as reference prefix
zstd = { version = "0.13", default-features = false }
junction = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = "symbols"
