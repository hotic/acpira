[package]
name = "acpira-host"
description = "The Acpira host runtime: ACP client, sessions, stores, accounts and the sidecar server (mirror of apps/vscode/src)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "acpira"
path = "src/bin/acpira.rs"

[dependencies]
trash.workspace = true
acpira-shared = { workspace = true, features = ["local-ipc"] }
acpira-rpc.workspace = true
acpira-host-base.workspace = true
acpira-store.workspace = true
acpira-plugin-build.workspace = true
acpira-agent.workspace = true
# Computer use: the driver this binary runs as `acpira computer-use` (computer.rs)
acpira-computer.workspace = true
# The login shell's environment for an engine a login service starts (cli.rs `serve --service`)
acpira-desktop = { path = "../acpira-desktop" }
# Paired devices: the gateway runs inside the engine (devices/host.rs)
acpira-gateway = { path = "../acpira-gateway" }
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
tar.workspace = true
libc.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
regex.workspace = true
same-file.workspace = true
semver.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# A command the shell exec'd in place, matched by its words (platform/process_tree.rs)
shlex.workspace = true
similar.workspace = true
tokio.workspace = true
toml.workspace = true
ureq.workspace = true
uuid.workspace = true
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys.workspace = true

[dev-dependencies]
# The scripted model server for the built-in agent's engine tests
acpira-agent = { workspace = true, features = ["mock"] }
# tests/pdf_child.rs builds its PDFs with the lopdf that pdf-extract re-exports
pdf-extract.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
