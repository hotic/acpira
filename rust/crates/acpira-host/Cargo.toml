[package]
name = "acpira-host"
description = "The Acpira host runtime: ACP client, sessions, stores, accounts and the sidecar server (mirror of apps/vscode/src)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "acpira"
path = "src/bin/acpira.rs"

[dependencies]
blake3.workspace = true
trash.workspace = true
acpira-shared = { workspace = true, features = ["local-ipc"] }
acpira-rpc.workspace = true
acpira-agent.workspace = true
# The login shell's environment for an engine a login service starts (cli.rs `serve --service`)
acpira-desktop = { path = "../acpira-desktop" }
# Paired devices: the gateway runs inside the engine (devices/host.rs)
acpira-gateway = { path = "../acpira-gateway" }
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
libc.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_codegen.workspace = true
oxc_diagnostics.workspace = true
oxc_parser.workspace = true
oxc_resolver.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_transformer.workspace = true
oxc_transformer_plugins.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
regex.workspace = true
rusqlite.workspace = true
same-file.workspace = true
semver.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# A command the shell exec'd in place, matched by its words (platform/process_tree.rs)
shlex.workspace = true
similar.workspace = true
tokio.workspace = true
toml.workspace = true
ureq.workspace = true
uuid.workspace = true
# Diff texts kept out of records and cold records packed (store/diff_texts.rs, store/pack.rs)
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys.workspace = true

[dev-dependencies]
# The scripted model server for the built-in agent's engine tests
acpira-agent = { workspace = true, features = ["mock"] }
# tests/pdf_child.rs builds its PDFs with the lopdf that pdf-extract re-exports
pdf-extract.workspace = true
tempfile.workspace = true

[lints]
workspace = true
