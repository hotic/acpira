[package]
name = "acpira-host"
description = "The Acpira host runtime: ACP client, sessions, stores, accounts and the sidecar server (mirror of apps/vscode/src)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "acpira"
path = "src/bin/acpira.rs"

[dependencies]
acpira-shared.workspace = true
acpira-rpc.workspace = true
acpira-agent.workspace = true
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
libc.workspace = true
parking_lot.workspace = true
portable-pty.workspace = true
regex.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tokio.workspace = true
toml.workspace = true
ureq.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys.workspace = true

[dev-dependencies]
# The scripted model server for the built-in agent's engine tests
acpira-agent = { workspace = true, features = ["mock"] }
# tests/pdf_child.rs builds its PDFs with the lopdf that pdf-extract re-exports
pdf-extract.workspace = true
tempfile.workspace = true

[lints]
workspace = true
