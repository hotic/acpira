[package]
name = "acpira-gateway"
description = "The computer side of paired devices: admits paired phones and computers and bridges them to an engine as peer wires"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "acpira-gateway"
path = "src/main.rs"

[dependencies]
acpira-desktop = { path = "../acpira-desktop" }
acpira-net = { path = "../acpira-net" }
acpira-shared = { workspace = true, features = ["local-ipc"] }
anyhow.workspace = true
base64.workspace = true
parking_lot.workspace = true
qrcode.workspace = true
# APNs over HTTP/2 (push.rs): the reqwest, rustls on ring and bundled roots iroh's relay client links already
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls-no-provider"] }
ring.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The pairing window's advertisement on Linux, beside Avahi (bonjour.rs), without container and VM bridges (gateway.rs)
[target.'cfg(target_os = "linux")'.dependencies]
if-addrs = "0.15"
mdns-sd = { version = "0.21", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
acpira-host = { path = "../acpira-host" }
tempfile.workspace = true

[lints]
workspace = true
