[package]
name = "acpira-shared"
description = "Contracts and pure logic shared by the Acpira host and webview (mirror of packages/shared)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
miniz_oxide.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# The local control channel (local_ipc.rs), for the crates that speak it; the mobile library goes without
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
local-ipc = ["dep:sha2", "dep:tokio"]

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[build-dependencies]
miniz_oxide.workspace = true

[lints]
workspace = true
